name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  web:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: claudio:smoke

      - name: Smoke test container startup
        run: |
          docker run -d --rm --name claudio-smoke -p 18080:8080 \
            -e CLAUDIO_DISABLE_AUTH=true \
            claudio:smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx 'claudio-smoke'; then
              docker logs claudio-smoke
              exit 1
            fi

            sleep 2
          done

          docker logs claudio-smoke
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f claudio-smoke || true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,value=${{ github.ref_name }},pattern={{version}}
            type=semver,value=${{ github.ref_name }},pattern={{major}}.{{minor}}
            type=semver,value=${{ github.ref_name }},pattern={{major}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ github.ref_name }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Create release
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --target "$RELEASE_SHA" \
              --title "Claudio ${RELEASE_TAG}" \
              --notes "See the assets below to download and install Claudio for your platform."
          fi

  desktop:
    needs: create-release
    permissions:
      contents: write
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            builder-args: --linux AppImage
          - platform: windows-latest
            builder-args: --win nsis portable
            uninstaller-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          working-directory: src/claudio-web
          cache: true
          run-install: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build uninstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cargo build --release -p claudio-uninstaller --target ${{ matrix.uninstaller-target }}
          mkdir -p target/release
          cp target/${{ matrix.uninstaller-target }}/release/claudio-game-uninstaller.exe target/release/claudio-game-uninstaller.exe

      - name: Install shell dependencies
        working-directory: src/claudio-electron
        run: vp install

      - name: Build claudio-core
        shell: bash
        run: cargo build --release -p claudio-core --bin claudio-core

      - name: Build web app for desktop
        working-directory: src/claudio-web
        env:
          CLAUDIO_DESKTOP_BUILD: "1"
        run: vp build

      - name: Bundle shell
        working-directory: src/claudio-electron
        run: vp pack

      - name: Package
        working-directory: src/claudio-electron
        run: vp exec electron-builder ${{ matrix.builder-args }} --publish never

      - name: Smoke test AppImage
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: src/claudio-electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke.mjs release/*.AppImage --appimage-extract-and-run --no-sandbox

      - name: Publish
        working-directory: src/claudio-electron
        run: vp exec electron-builder ${{ matrix.builder-args }} --publish always
