name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  verify-tests:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Require successful CI for the release commit
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            if (!context.ref.startsWith('refs/tags/v')) {
              core.setFailed('Release blocked: select a version tag to release.');
              return;
            }
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo,
              path: 'src/claudio-electron/package.json',
              ref: sha,
            });
            const { version } = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            const tag = context.ref.slice('refs/tags/'.length);
            if (tag !== `v${version}`) {
              core.setFailed(`Release blocked: ${tag} does not match app version v${version}.`);
              return;
            }
            const { data: reference } = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${tag}`,
            });
            let target = reference.object;
            while (target.type === 'tag') {
              const { data: annotated } = await github.rest.git.getTag({
                ...context.repo,
                tag_sha: target.sha,
              });
              target = annotated.object;
            }
            if (target.type !== 'commit' || target.sha !== sha) {
              core.setFailed(`Release blocked: ${tag} does not point to tested commit ${sha}.`);
              return;
            }
            let run;
            for (let attempt = 0; attempt < 90; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id: 'test.yml',
                head_sha: sha,
                per_page: 100,
              });
              const matching = runs.filter(run =>
                run.head_sha === sha &&
                run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                ['push', 'workflow_dispatch'].includes(run.event)
              );
              run = matching.find(run => run.status === 'completed' && run.conclusion === 'success');
              if (run) break;
              if (matching.length && matching.every(run => run.status === 'completed')) {
                core.setFailed(`Release blocked: Tests failed or was cancelled for commit ${sha}.`);
                return;
              }
              if (attempt < 89) {
                core.info(`Waiting for Tests on ${sha} (attempt ${attempt + 1}/90).`);
                await new Promise(resolve => setTimeout(resolve, 30000));
              }
            }
            if (!run) {
              core.setFailed(`Release blocked: timed out waiting for Tests on ${sha}. Run test.yml on this commit, then rerun this release.`);
              return;
            }
            core.setOutput('sha', sha);
            core.setOutput('tag', tag);
            core.info(`Verified ${tag} and successful CI: ${run.html_url}`);

  web:
    needs: verify-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-tests.outputs.sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: claudio:smoke

      - name: Smoke test container startup
        run: |
          docker run -d --rm --name claudio-smoke -p 18080:8080 \
            -e CLAUDIO_DISABLE_AUTH=true \
            claudio:smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx 'claudio-smoke'; then
              docker logs claudio-smoke
              exit 1
            fi

            sleep 2
          done

          docker logs claudio-smoke
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f claudio-smoke || true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,value=${{ needs.verify-tests.outputs.tag }},pattern={{version}}
            type=semver,value=${{ needs.verify-tests.outputs.tag }},pattern={{major}}.{{minor}}
            type=semver,value=${{ needs.verify-tests.outputs.tag }},pattern={{major}}
          labels: |
            org.opencontainers.image.revision=${{ needs.verify-tests.outputs.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  create-release:
    needs: verify-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ needs.verify-tests.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.verify-tests.outputs.tag }}
      RELEASE_SHA: ${{ needs.verify-tests.outputs.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-tests.outputs.sha }}

      - name: Create release
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --target "$RELEASE_SHA" \
              --title "Claudio ${RELEASE_TAG}" \
              --notes "See the assets below to download and install Claudio for your platform."
          fi

  desktop:
    needs: [verify-tests, create-release]
    permissions:
      contents: write
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            builder-args: --linux AppImage
          - platform: windows-latest
            builder-args: --win nsis portable
            uninstaller-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-tests.outputs.sha }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          working-directory: src/claudio-web
          cache: true
          run-install: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build uninstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cargo build --release -p claudio-uninstaller --target ${{ matrix.uninstaller-target }}
          mkdir -p target/release
          cp target/${{ matrix.uninstaller-target }}/release/claudio-game-uninstaller.exe target/release/claudio-game-uninstaller.exe

      - name: Install shell dependencies
        working-directory: src/claudio-electron
        run: vp install

      - name: Build claudio-core
        shell: bash
        run: cargo build --release -p claudio-desktop --bin claudio-core

      - name: Build web app for desktop
        working-directory: src/claudio-web
        env:
          CLAUDIO_DESKTOP_BUILD: "1"
        run: vp build

      - name: Bundle shell
        working-directory: src/claudio-electron
        run: vp pack

      - name: Package
        working-directory: src/claudio-electron
        run: vp exec electron-builder ${{ matrix.builder-args }} --publish never

      - name: Smoke test AppImage
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: src/claudio-electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke.mjs release/*.AppImage --appimage-extract-and-run --no-sandbox

      - name: Publish
        working-directory: src/claudio-electron
        run: vp exec electron-builder ${{ matrix.builder-args }} --publish always
