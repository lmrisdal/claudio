name: Build Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/claudio-api/**"
      - "src/claudio-desktop/**"
      - "src/claudio-electron/**"
      - "src/claudio-uninstaller/**"
      - "tests/**"
      - "src/claudio-web/**"
      - "docker/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop-tests: ${{ steps.filter.outputs.desktop-tests }}
      desktop-build: ${{ steps.filter.outputs.desktop-build }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - "src/claudio-api/**"
              - "tests/**"
              - "src/claudio-web/**"
              - "docker/**"
              - "Directory.Build.props"
              - "Directory.Packages.props"
              - "Claudio.slnx"
            desktop-tests:
              - "src/claudio-desktop/**"
              - "src/claudio-uninstaller/**"
              - "tests/claudio-desktop/**"
              - "src/claudio-web/**"
              - "Cargo.toml"
              - "Cargo.lock"
            desktop-build:
              - "src/claudio-desktop/**"
              - "src/claudio-electron/**"
              - "src/claudio-uninstaller/**"
              - "src/claudio-web/**"
              - "Cargo.toml"
              - "Cargo.lock"

  web-image:
    needs: web-tests
    if: needs.web-tests.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: claudio:smoke

      - name: Smoke test container startup
        run: |
          docker run -d --rm --name claudio-smoke -p 18080:8080 \
            -e CLAUDIO_DISABLE_AUTH=true \
            claudio:smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx 'claudio-smoke'; then
              docker logs claudio-smoke
              exit 1
            fi

            sleep 2
          done

          docker logs claudio-smoke
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f claudio-smoke || true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  web-tests:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore tests/claudio-api/Claudio.Api.Tests.csproj

      - run: dotnet build tests/claudio-api/Claudio.Api.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet run --project tests/claudio-api --no-build

  desktop-tests:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.desktop-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build uninstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cargo_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              status=$?
              echo "Cargo command failed with exit code $status (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            return "$status"
          }

          cargo_retry cargo build --release -p claudio-uninstaller --target x86_64-pc-windows-msvc
          mkdir -p target/release
          cp target/x86_64-pc-windows-msvc/release/claudio-game-uninstaller.exe target/release/claudio-game-uninstaller.exe

      - name: Run desktop Rust tests
        shell: bash
        run: |
          cargo_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              status=$?
              echo "Cargo command failed with exit code $status (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            return "$status"
          }

          cargo_retry cargo test --workspace

  dev-release:
    needs: [detect-changes, desktop-tests]
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.desktop-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Ensure draft pre-release for the dev tag
        id: release
        run: |
          body="Latest development build from ${GITHUB_REF_NAME}. Commit: ${GITHUB_SHA}"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.tag_name=="dev") | .id' | head -n1)"
          if [ -z "$id" ]; then
            id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name=dev \
              -f name="Claudio Dev Build" \
              -f body="$body" \
              -f target_commitish="${GITHUB_SHA}" \
              -F draft=true \
              -F prerelease=true \
              --jq .id)"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -f body="$body" --silent
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [detect-changes, desktop-tests, dev-release]
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.desktop-build == 'true'
    permissions:
      contents: write
    env:
      CLAUDIO_COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.dev-release.outputs.id }}
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            builder-args: --linux AppImage
          - platform: windows-latest
            builder-args: --win nsis portable
            uninstaller-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          working-directory: src/claudio-web
          cache: true
          run-install: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build uninstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cargo build --release -p claudio-uninstaller --target ${{ matrix.uninstaller-target }}
          mkdir -p target/release
          cp target/${{ matrix.uninstaller-target }}/release/claudio-game-uninstaller.exe target/release/claudio-game-uninstaller.exe

      - name: Install shell dependencies
        working-directory: src/claudio-electron
        run: vp install

      - name: Build claudio-core
        shell: bash
        run: cargo build --release -p claudio-desktop --bin claudio-core

      - name: Build web app for desktop
        working-directory: src/claudio-web
        env:
          CLAUDIO_DESKTOP_BUILD: "1"
        run: vp build

      - name: Bundle shell
        working-directory: src/claudio-electron
        run: vp pack

      - name: Package
        working-directory: src/claudio-electron
        run: vp exec electron-builder ${{ matrix.builder-args }} --publish never

      - name: Smoke test AppImage
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: src/claudio-electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke.mjs release/*.AppImage --appimage-extract-and-run --no-sandbox

      - name: Upload to dev release
        shell: bash
        working-directory: src/claudio-electron
        run: |
          for file in release/*.AppImage release/*.exe release/latest*.yml; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            for asset in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq ".[] | select(.name==\"${name}\") | .id"); do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
            done
            gh api -X POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "$file" > /dev/null
          done
