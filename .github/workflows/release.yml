name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      sidecar:
        description: Desktop sidecar to package (tag pushes always package rust)
        type: choice
        options: [rust, csharp]
        default: rust

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - id: version
        run: node scripts/release-version.cjs

  ci:
    name: Validate release commit
    needs: version
    uses: ./.github/workflows/ci.yml

  desktop:
    name: Package desktop (${{ matrix.os }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            args: --linux AppImage --x64
          - os: windows-2025
            platform: windows
            args: --win nsis portable --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CLAUDIO_COMMIT_SHA: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      SIDECAR: ${{ github.event_name == 'workflow_dispatch' && inputs.sidecar || 'rust' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        if: env.SIDECAR == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: env.SIDECAR == 'rust'
      - name: Build sidecar
        if: env.SIDECAR == 'rust'
        run: cargo build --release --locked -p claudio-core --bin claudio-core
      - name: Build Windows uninstaller
        if: env.SIDECAR == 'rust' && runner.os == 'Windows'
        run: cargo build --release --locked -p claudio-uninstaller
      - uses: actions/setup-dotnet@v5
        if: env.SIDECAR == 'csharp'
        with:
          dotnet-version: 10.0.x
      - name: Install Native AOT prerequisites
        if: env.SIDECAR == 'csharp' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang zlib1g-dev libssl-dev cmake make
      - name: Build C# sidecar (Native AOT)
        if: env.SIDECAR == 'csharp'
        run: |
          rid=linux-x64
          extra=-p:StaticOpenSslLinking=true
          if [ "$RUNNER_OS" = Windows ]; then rid=win-x64; extra=; fi
          dotnet publish src/claudio-core-cs -c Release -r "$rid" $extra -o artifacts/claudio-core-cs/publish
          if [ "$RUNNER_OS" = Windows ]; then
            dotnet publish src/claudio-uninstaller-cs -c Release -r "$rid" -o artifacts/claudio-uninstaller-cs/publish
          fi
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          working-directory: src/claudio-web
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - name: Build desktop frontend
        working-directory: src/claudio-web
        env:
          CLAUDIO_DESKTOP_BUILD: '1'
        run: vp run build
      - name: Fetch 7-Zip
        if: env.SIDECAR == 'csharp'
        run: |
          source_flag=
          if [ "$RUNNER_OS" = Linux ]; then source_flag=--with-source; fi
          node scripts/fetch-7zip.mjs "$(node -p process.platform)" artifacts/7-zip $source_flag
      - name: Stage sidecar
        run: node scripts/stage-sidecar.mjs "$SIDECAR"
      - name: Install shell dependencies
        working-directory: src/claudio-electron
        run: vp install --frozen-lockfile
      - name: Bundle shell
        working-directory: src/claudio-electron
        run: vp pack
      - name: Package
        working-directory: src/claudio-electron
        run: vp exec electron-builder ${{ matrix.args }} --publish never
      - name: Smoke-test AppImage
        if: runner.os == 'Linux'
        working-directory: src/claudio-electron
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb
          chmod +x release/*.AppImage
          xvfb-run -a node scripts/smoke.mjs release/*.AppImage --appimage-extract-and-run --no-sandbox
      - name: Smoke-test packaged Windows app
        if: runner.os == 'Windows'
        working-directory: src/claudio-electron
        run: node scripts/smoke.mjs release/win-unpacked/Claudio.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            artifacts/7-zip/7z*-src.tar.xz
            src/claudio-electron/release/*.AppImage
            src/claudio-electron/release/*.exe
            src/claudio-electron/release/*.blockmap
            src/claudio-electron/release/*.yml
            !src/claudio-electron/release/builder-*.yml

  container:
    name: Package container (${{ matrix.arch }})
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: claudio:release-${{ matrix.arch }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.arch }}
      - name: Verify server and frontend
        run: bash scripts/smoke-container.sh claudio:release-${{ matrix.arch }}
      - name: Export tested image
        run: docker save claudio:release-${{ matrix.arch }} | gzip > container-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.arch }}
          path: container-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [version, desktop, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: container-*
          path: images
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload tested assets to draft release
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Claudio $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
      - name: Publish tested container images
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            docker load --input "images/container-${arch}.tar.gz"
            docker tag "claudio:release-${arch}" "${image}:sha-${GITHUB_SHA}-${arch}"
            docker push "${image}:sha-${GITHUB_SHA}-${arch}"
          done
          tags=(--tag "${image}:${VERSION}")
          if [ "$PRERELEASE" = true ]; then
            tags+=(--tag "${image}:dev")
          else
            tags+=(--tag "${image}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${image}:sha-${GITHUB_SHA}-amd64" \
            "${image}:sha-${GITHUB_SHA}-arm64"
      - name: Publish GitHub release
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
