name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore tests/claudio-api/Claudio.Api.Tests.csproj

      - run: dotnet build tests/claudio-api/Claudio.Api.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet run --project tests/claudio-api --no-build

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: claudio:smoke

      - name: Smoke test container startup
        run: |
          docker run -d --rm --name claudio-smoke -p 18080:8080 \
            -e CLAUDIO_DISABLE_AUTH=true \
            claudio:smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx 'claudio-smoke'; then
              docker logs claudio-smoke
              exit 1
            fi

            sleep 2
          done

          docker logs claudio-smoke
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f claudio-smoke || true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build uninstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cargo_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              status=$?
              echo "Cargo command failed with exit code $status (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            return "$status"
          }

          cargo_retry cargo build --release -p claudio-uninstaller --target x86_64-pc-windows-msvc
          mkdir -p target/release
          cp target/x86_64-pc-windows-msvc/release/claudio-game-uninstaller.exe target/release/claudio-game-uninstaller.exe

      - name: Run desktop Rust tests
        shell: bash
        run: |
          cargo_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              status=$?
              echo "Cargo command failed with exit code $status (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            return "$status"
          }

          cargo_retry cargo test --workspace

  create-release:
    needs: desktop-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: version
        run: |
          version="$(node -p "require('./src/claudio-electron/package.json').version")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ steps.version.outputs.tag }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Create release
        run: |
          if ! gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release create "${{ steps.version.outputs.tag }}" \
              --target "$GITHUB_SHA" \
              --title "Claudio ${{ steps.version.outputs.tag }}" \
              --notes "See the assets below to download and install Claudio for your platform."
          fi

  desktop:
    needs: create-release
    permissions:
      contents: write
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            builder-args: --linux AppImage
          - platform: windows-latest
            builder-args: --win nsis
            uninstaller-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          working-directory: src/claudio-web
          cache: true
          run-install: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build uninstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cargo build --release -p claudio-uninstaller --target ${{ matrix.uninstaller-target }}
          mkdir -p target/release
          cp target/${{ matrix.uninstaller-target }}/release/claudio-game-uninstaller.exe target/release/claudio-game-uninstaller.exe

      - name: Install shell dependencies
        working-directory: src/claudio-electron
        run: vp install

      - name: Build claudio-core
        shell: bash
        run: cargo build --release -p claudio-desktop --bin claudio-core

      - name: Build web app for desktop
        working-directory: src/claudio-web
        env:
          CLAUDIO_DESKTOP_BUILD: "1"
        run: vp build

      - name: Bundle shell
        working-directory: src/claudio-electron
        run: vp pack

      - name: Package and publish
        working-directory: src/claudio-electron
        run: vp exec electron-builder ${{ matrix.builder-args }} --publish always
