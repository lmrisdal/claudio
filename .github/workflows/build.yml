name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      build-web-image:
        description: Build and push docker image
        type: boolean
        default: true
      build-desktop:
        description: Build desktop app
        type: boolean
        default: true
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

jobs:
  verify-tests:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      tagged: ${{ steps.verify.outputs.tagged }}
    steps:
      - name: Require successful CI for the build commit
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo,
              workflow_id: 'test.yml',
              head_sha: sha,
              per_page: 100,
            });
            const run = runs.find(run =>
              run.head_sha === sha &&
              run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              ['push', 'workflow_dispatch'].includes(run.event) &&
              run.status === 'completed' &&
              run.conclusion === 'success'
            );
            if (!run) {
              core.setFailed(
                `Build blocked: Tests has not passed for commit ${sha}. ` +
                'Wait for CI or manually run test.yml on this exact commit, then rerun this build.'
              );
              return;
            }
            let tagged = false;
            if (context.eventName === 'workflow_run') {
              const tags = await github.paginate(github.rest.repos.listTags, {
                ...context.repo,
                per_page: 100,
              });
              tagged = tags.some(tag => tag.name.startsWith('v') && tag.commit.sha === sha);
            }
            core.setOutput('tagged', String(tagged));
            core.setOutput('sha', sha);
            core.info(`Verified successful CI: ${run.html_url}`);

  detect-changes:
    needs: verify-tests
    if: needs.verify-tests.outputs.tagged != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.web == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.desktop == 'true' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-tests.outputs.sha }}
          fetch-depth: 0
      - name: Download tested push range
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: build-context
          path: ${{ runner.temp }}/build-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect artifact source changes
        if: github.event_name == 'workflow_run'
        id: changes
        env:
          BUILD_SHA: ${{ needs.verify-tests.outputs.sha }}
        run: node scripts/build-changes.cjs "$RUNNER_TEMP/build-context/build-context.json"

  web-image:
    needs: [verify-tests, detect-changes]
    if: ${{ needs.verify-tests.outputs.tagged != 'true' && needs.detect-changes.outputs.web == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build-web-image) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-tests.outputs.sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          platforms: linux/amd64
          tags: claudio:smoke

      - name: Smoke test container startup
        run: |
          docker run -d --rm --name claudio-smoke -p 18080:8080 \
            -e CLAUDIO_DISABLE_AUTH=true \
            claudio:smoke

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx 'claudio-smoke'; then
              docker logs claudio-smoke
              exit 1
            fi

            sleep 2
          done

          docker logs claudio-smoke
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f claudio-smoke || true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
          labels: |
            org.opencontainers.image.revision=${{ needs.verify-tests.outputs.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  dev-release:
    needs: [verify-tests, detect-changes]
    if: ${{ needs.verify-tests.outputs.tagged != 'true' && needs.detect-changes.outputs.desktop == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build-desktop) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_SHA: ${{ needs.verify-tests.outputs.sha }}

    steps:
      - name: Ensure draft pre-release for the dev tag
        id: release
        run: |
          body="Latest development build from ${GITHUB_REF_NAME}. Commit: ${BUILD_SHA}"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.tag_name=="dev") | .id' | head -n1)"
          if [ -z "$id" ]; then
            id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name=dev \
              -f name="Claudio Dev Build" \
              -f body="$body" \
              -f target_commitish="${BUILD_SHA}" \
              -F draft=true \
              -F prerelease=true \
              --jq .id)"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" -f body="$body" --silent
          fi
          echo "id=${id}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [verify-tests, detect-changes, dev-release]
    if: ${{ needs.verify-tests.outputs.tagged != 'true' && needs.detect-changes.outputs.desktop == 'true' && (github.event_name != 'workflow_dispatch' || inputs.build-desktop) }}
    permissions:
      contents: write
    env:
      CLAUDIO_COMMIT_SHA: ${{ needs.verify-tests.outputs.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.dev-release.outputs.id }}
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            builder-args: --linux AppImage
          - platform: windows-latest
            builder-args: --win nsis portable
            uninstaller-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-tests.outputs.sha }}

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          working-directory: src/claudio-web
          cache: true
          run-install: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build uninstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cargo build --release -p claudio-uninstaller --target ${{ matrix.uninstaller-target }}
          mkdir -p target/release
          cp target/${{ matrix.uninstaller-target }}/release/claudio-game-uninstaller.exe target/release/claudio-game-uninstaller.exe

      - name: Install shell dependencies
        working-directory: src/claudio-electron
        run: vp install

      - name: Build claudio-core
        shell: bash
        run: cargo build --release -p claudio-core --bin claudio-core

      - name: Build web app for desktop
        working-directory: src/claudio-web
        env:
          CLAUDIO_DESKTOP_BUILD: "1"
        run: vp build

      - name: Bundle shell
        working-directory: src/claudio-electron
        run: vp pack

      - name: Package
        working-directory: src/claudio-electron
        run: vp exec electron-builder ${{ matrix.builder-args }} --publish never

      - name: Smoke test AppImage
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: src/claudio-electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke.mjs release/*.AppImage --appimage-extract-and-run --no-sandbox

      - name: Upload to dev release
        shell: bash
        working-directory: src/claudio-electron
        run: |
          for file in release/*.AppImage release/*.exe release/latest*.yml; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            for asset in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq ".[] | select(.name==\"${name}\") | .id"); do
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
            done
            gh api -X POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "$file" > /dev/null
          done
