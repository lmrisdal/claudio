name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/claudio-api/**"
      - "src/claudio-desktop/**"
      - "src/claudio-electron/**"
      - "src/claudio-uninstaller/**"
      - "src/claudio-web/**"
      - "tests/**"
      - "docker/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "Claudio.slnx"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - "scripts/build-changes.cjs"
      - "scripts/workflows.test.cjs"
  pull_request:
    branches: [main]

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record push range for artifact change detection
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          node -e 'require("node:fs").writeFileSync("build-context.json", JSON.stringify({before: process.env.PUSH_BEFORE, sha: process.env.PUSH_SHA}))'
      - name: Upload push range
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: build-context.json
      - name: Test build and release CI gates
        run: node --test scripts/workflows.test.cjs

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore tests/claudio-api/Claudio.Api.Tests.csproj

      - run: dotnet build tests/claudio-api/Claudio.Api.Tests.csproj --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test --project tests/claudio-api --no-build \
            --results-directory $RUNNER_TEMP/TestResults \
            -- --coverage --coverage-output-format cobertura

      - name: Generate coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: ${{ runner.temp }}/TestResults/*.cobertura.xml
          targetdir: ${{ runner.temp }}/TestResults/report
          reporttypes: MarkdownSummaryGithub;Html

      - name: Add coverage to job summary
        if: always()
        run: cat $RUNNER_TEMP/TestResults/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ runner.temp }}/TestResults/report
          retention-days: 30

  desktop-tests:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build uninstaller (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cargo_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              status=$?
              echo "Cargo command failed with exit code $status (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            return "$status"
          }

          cargo_retry cargo build --release -p claudio-uninstaller --target x86_64-pc-windows-msvc
          mkdir -p target/release
          cp target/x86_64-pc-windows-msvc/release/claudio-game-uninstaller.exe target/release/claudio-game-uninstaller.exe

      - name: Run desktop Rust tests
        shell: bash
        run: |
          cargo_retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              status=$?
              echo "Cargo command failed with exit code $status (attempt $attempt/3)"
              sleep $((attempt * 10))
            done
            return "$status"
          }

          cargo_retry cargo test --workspace

  desktop-shell-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          working-directory: src/claudio-electron
          cache: true
          run-install: true

      - name: Check shell
        working-directory: src/claudio-electron
        run: vp check

      - name: Test shell
        working-directory: src/claudio-electron
        run: vp test
