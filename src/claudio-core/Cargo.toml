[package]
name = "claudio-core"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "claudio-core"
path = "src/main.rs"

[lib]
name = "claudio_core"
path = "src/lib.rs"

[features]
default = []
integration-tests = []

[dependencies]
base64 = "0.22"
log = "0.4"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "stream",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
url = "2"
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.24.2", default-features = false, features = ["bzip2", "deflate", "ppmd", "util"] }

[target.'cfg(target_os = "windows")'.dependencies]
mslnk = "0.1"
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


