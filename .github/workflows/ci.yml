name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: src/claudio-api/packages.lock.json
      - run: dotnet restore tests/claudio-api/Claudio.Api.Tests.csproj --locked-mode
      - run: dotnet build tests/claudio-api/Claudio.Api.Tests.csproj --no-restore --configuration Release
      - run: dotnet test --project tests/claudio-api --no-build --configuration Release

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/claudio-web
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          working-directory: src/claudio-web
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp check
      - run: vp test
      - run: vp run build

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Build sidecar for shell integration tests
        run: cargo build --locked -p claudio-core --bin claudio-core
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22'
          working-directory: src/claudio-desktop/app
          cache: true
          run-install: |
            args: ['--frozen-lockfile']
      - run: vp check
        working-directory: src/claudio-desktop/app
      - run: vp test
        working-directory: src/claudio-desktop/app
      - run: vp pack
        working-directory: src/claudio-desktop/app
      - name: Test release helpers
        if: runner.os == 'Linux'
        run: node --test scripts/*.test.cjs

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: claudio:smoke
          cache-from: type=gha,scope=container-amd64
          cache-to: type=gha,mode=max,scope=container-amd64
      - name: Verify server and frontend
        run: bash scripts/smoke-container.sh claudio:smoke

  required:
    name: CI passed
    if: always()
    needs: [api, web, desktop, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(. == "success")' <<< "$RESULTS"
